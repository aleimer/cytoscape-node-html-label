name: CI Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint sources
        run: npm run lint
      - name: Build sources
        run: npm run build
      - name: Run tests (headless Chrome)
        run: npm test
